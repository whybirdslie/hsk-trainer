name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy public/ + functions to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 80d41f9e23a0f4af1bc6ffd553c5d5c8
          # Reads wrangler.toml (KV binding BACKUP_KV) and ships functions/
          command: pages deploy public --project-name=hsk-trainer
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
