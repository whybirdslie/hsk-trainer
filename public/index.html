<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>HSK Zeichentrainer</title>
<meta name="theme-color" content="#B5332B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HSK">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one thumb-friendly column; content scrolls between a slim header and a bottom tab bar.
   The memorable element is the 米字格 practice grid behind every large character. */
:root{
  --paper:#F1F3EE; --card:#FCFCFA; --sunk:#E7EAE3; --ink:#1B2029; --ink2:#4B525D; --ink3:#7A818B; --line:#D6DAD0;
  --grid:#E2B4AC; --seal:#B5332B; --seal-ink:#FFF7F3; --jade:#2C6A55; --jade-bg:#DCEBE3; --amber:#9C640F; --amber-bg:#F3E6CC;
  --sky:#285C86; --sky-bg:#DCE7F1; --red-bg:#F4DCD8;
  --ui: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --kai: "Kaiti SC","STKaiti","KaiTi","楷体","HSK Kai","LXGW WenKai GB",serif;
  --song: "Songti SC","STSong","SimSun","宋体","Noto Serif CJK SC","Noto Serif SC","Source Han Serif SC",serif;
  --hei: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC",sans-serif;
  --hz: var(--kai);
  --r: 14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161B; --card:#1A1F26; --sunk:#232932; --ink:#ECEEE9; --ink2:#B6BBC2; --ink3:#828A94; --line:#2E353F;
  --grid:#5C2F2B; --seal:#E05A4E; --seal-ink:#1A0F0D; --jade:#62B896; --jade-bg:#1D3A30; --amber:#E3A646; --amber-bg:#3B2E17;
  --sky:#86B6E0; --sky-bg:#1C2D3E; --red-bg:#3E2020; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12161B; --card:#1A1F26; --sunk:#232932; --ink:#ECEEE9; --ink2:#B6BBC2; --ink3:#828A94; --line:#2E353F;
  --grid:#5C2F2B; --seal:#E05A4E; --seal-ink:#1A0F0D; --jade:#62B896; --jade-bg:#1D3A30; --amber:#E3A646; --amber-bg:#3B2E17;
  --sky:#86B6E0; --sky-bg:#1C2D3E; --red-bg:#3E2020; color-scheme:dark }
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
input,textarea,.copy{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.hz{font-family:var(--hz);font-weight:400}
#app{display:block}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.sealmark{width:30px;height:30px;border-radius:6px;background:var(--seal);color:var(--seal-ink);display:grid;place-items:center;font-size:19px;line-height:1;flex:0 0 auto}
.brand b{font:600 17px/1.1 var(--serif);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
.sync.cloud{background:var(--jade)} .sync.local{background:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
main{display:block;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3);min-height:54px}
nav.tabs button .ti{font-size:21px;line-height:1.1;font-family:var(--hz)}
nav.tabs button[aria-current="page"]{color:var(--seal)}
h2{font:600 19px/1.25 var(--serif);margin:0;text-wrap:balance}
h3{font:600 15px/1.3 var(--ui);margin:0}
.muted{color:var(--ink3)} .small{font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.seal{background:var(--seal);color:var(--seal-ink);border-color:var(--seal)}
.btn.jade{background:var(--jade-bg);color:var(--jade);border-color:color-mix(in srgb,var(--jade) 35%,var(--line))}
.btn.sky{background:var(--sky-bg);color:var(--sky);border-color:color-mix(in srgb,var(--sky) 35%,var(--line))}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:12px}
.badge{display:inline-grid;place-items:center;border:1.5px solid var(--seal);color:var(--seal);border-radius:5px;font:600 11px/1 var(--ui);padding:3px 5px;letter-spacing:.3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.tag.warn{background:var(--amber-bg);color:var(--amber)}
.tag.info{background:var(--sky-bg);color:var(--sky)}
/* selection summary */
.sel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--ink3);border-radius:var(--r);background:transparent;padding:12px 14px}
.sel .grow{flex:1;min-width:0}
.sel .lv{font:600 16px/1.3 var(--ui)}
/* hero study block */
.study{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.mizi{position:relative;width:104px;aspect-ratio:1;max-width:100%;border:1.5px solid var(--grid);background:var(--card);display:grid;place-items:center}
.mizi svg{position:absolute;inset:0;width:100%;height:100%;color:var(--grid)}
.mizi span{position:relative;font-size:68px;line-height:1;font-family:var(--hz)}
.counts{display:flex;gap:18px;flex-wrap:wrap}
.count b{display:block;font:600 30px/1 var(--serif);font-variant-numeric:tabular-nums}
.count span{font-size:12.5px;color:var(--ink3)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.mode .mk{font-size:26px;line-height:1;font-family:var(--hz);color:var(--seal)}
.mode b{font-size:14.5px}
.mode span{font-size:12.5px;color:var(--ink3);line-height:1.35}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px}
.kpi b{display:block;font:600 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink3)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--jade)} .track .l{background:color-mix(in srgb,var(--jade) 45%,var(--sunk))}
.bar .num{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;white-space:nowrap}
.spark{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:84px}
.spark div{background:var(--sky);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.spark div.today{background:var(--seal)}
.sparkx{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10px;color:var(--ink3);text-align:center}
.weak{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.weak button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.weak .hz{font-size:30px;line-height:1.1}
.weak small{font-size:11px;color:var(--seal);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* word list */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;min-height:44px}
.wl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.wi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.wi:last-child{border-bottom:0}
.wi .hz{font-size:26px;line-height:1.1;min-width:2.2em}
.wi .meta{min-width:0}
.wi .py{display:block;font-size:13px;color:var(--ink2)}
.wi .mn{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.dot.l{background:var(--amber)} .dot.k{background:var(--jade)} .dot.d{background:var(--seal)}
/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.field label{font-weight:500}
.field .seg button{padding:5px 10px}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;min-height:40px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box}
.codebox{font:600 15px/1.55 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center;user-select:text;-webkit-user-select:text;word-break:break-all}
.cloudstat{display:flex;flex-direction:column;gap:8px}
.cloudstat .ok{color:var(--jade)} .cloudstat .warn{color:var(--amber)} .cloudstat .bad{color:var(--seal)}
.src{display:flex;flex-direction:column;gap:6px;font-size:13px}
.src a{color:var(--sky)}
/* session overlay */
#session{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbar{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.x{border:0;background:var(--sunk);width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1;display:grid;place-items:center;flex:0 0 auto}
.prog{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--seal);width:0;transition:width .25s}
.stitle{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.sbody{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.sinner{max-width:620px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.sfoot{max-width:620px;width:100%;margin:0 auto;padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.bigz{position:relative;width:min(70vw,260px);aspect-ratio:1;border:1.5px solid var(--grid);display:grid;place-items:center;background:var(--card)}
.bigz.multi{width:auto;min-width:min(70vw,260px);aspect-ratio:auto;height:min(46vw,190px);padding:0 18px}
.bigz svg{position:absolute;inset:0;width:100%;height:100%;color:var(--grid)}
.bigz .hz{position:relative;font-size:min(46vw,180px);line-height:1}
.bigz.multi .hz{font-size:min(19vw,104px);letter-spacing:.04em;white-space:nowrap}
.bigz.sm{width:min(40vw,150px)} .bigz.sm .hz{font-size:min(28vw,104px)} .bigz.multi.sm{width:auto;min-width:min(40vw,150px);height:min(26vw,110px)} .bigz.multi.sm .hz{font-size:min(12vw,62px)}
.kbd{display:none} @media (hover:hover) and (pointer:fine){.kbd{display:block}}
.bigz.l3 .hz{font-size:min(17vw,92px)} .bigz.l4 .hz{font-size:min(14vw,76px)} .bigz.l5 .hz{font-size:min(11vw,62px)}
.tapnote{font-size:13px;color:var(--ink3)}
.back{width:100%;display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.pyl{font-size:22px;font-weight:600;text-align:center;letter-spacing:.3px}
.sense{display:flex;flex-direction:column;gap:4px}
.sense .pys{font-weight:600;color:var(--ink2);font-size:14px}
.mean{font-size:16px;line-height:1.45}
.mean .lang{font-size:11px;font-weight:700;color:var(--ink3);margin-right:6px;letter-spacing:.4px}
.ex{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px}
.ex .zh{font-family:var(--hz);font-size:20px;line-height:1.35}
.ex .py{font-size:13px;color:var(--ink2)}
.ex .tr{font-size:14px}
.chars{display:flex;gap:8px;flex-wrap:nowrap;width:100%}
.chars .cbox{flex:1;min-width:0;justify-content:center}
.cbox{border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-size:12.5px;max-width:100%}
.cbox .hz{font-size:24px;line-height:1}
.audio{border:1px solid var(--line);background:var(--card);border-radius:999px;width:40px;height:40px;display:grid;place-items:center}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:0;border-radius:12px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:700;min-height:58px}
.grade small{font-weight:500;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.g0{background:var(--red-bg);color:var(--seal)} .g1{background:var(--amber-bg);color:var(--amber)} .g2{background:var(--jade-bg);color:var(--jade)} .g3{background:var(--sky-bg);color:var(--sky)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.hzopts{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;text-align:left;min-height:52px;font-size:15.5px;display:flex;align-items:center;gap:10px}
.opt .k{font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-variant-numeric:tabular-nums}
.opt.hzo{justify-content:center;font-family:var(--hz);font-size:46px;line-height:1.1;padding:14px 8px}
.opt.ok{border-color:var(--jade);background:var(--jade-bg)} .opt.bad{border-color:var(--seal);background:var(--red-bg)}
.opt:disabled{cursor:default}
.prompt{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.prompt .q{font-size:13px;color:var(--ink3)}
.prompt .big{font-size:20px;font-weight:600}
.feedback{border-radius:12px;padding:12px;background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.cmp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmp .op{color:var(--ink3)}
.timer{font:600 40px/1 var(--serif);font-variant-numeric:tabular-nums;text-align:center}
.speedbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.speedbtns .btn{min-height:64px;font-size:16px}
.result{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-top:20px}
.result .score{font:600 56px/1 var(--serif);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left}
.list .li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.list .li .hz{font-size:24px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,var(--ink) 38%,transparent)}
.sheet{background:var(--paper);width:100%;max-width:680px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sbody2{overflow-y:auto;padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px}
.grid2{display:flex;gap:8px;flex-wrap:wrap}
.xbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xbtns .btn{height:52px;min-height:52px;white-space:nowrap;padding:0 10px}
.xbtns .btn svg{flex:0 0 auto}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.loading{display:grid;place-items:center;min-height:60vh;gap:10px;text-align:center;color:var(--ink3)}
.loading .hz{font-size:64px;color:var(--seal);font-family:var(--hz)}
@media (max-width:420px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .modes{grid-template-columns:1fr 1fr} .mizi{width:84px} .mizi span{font-size:54px} .count b{font-size:26px} }
@media (min-width:760px){ .modes{grid-template-columns:repeat(3,1fr)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="sealmark hz" aria-hidden="true">字</span><b id="brandName">HSK Zeichentrainer</b></div>
    <div class="seg" role="group" aria-label="Sprache / Language"><button id="langDe" aria-pressed="true">DE</button><button id="langEn" aria-pressed="false">EN</button></div>

const S={W:[],C:{},cats:[],rads:{},conf:[],charIdx:new Map(),prog:{v:1,p:{},c:{},meta:{...DEF_META}},tab:"learn",wl:{q:"",scope:"sel",claude:false,limit:80},cloud:null,cloudHealth:null};

function lsGet(){try{const s=localStorage.getItem(LS_KEY);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS_KEY,JSON.stringify(S.prog))}catch(e){}}

function mergeMeta(a,b){
  const out={...DEF_META,...a};
  if((b.setAt||0)>(a.setAt||0)) for(const k of ["lang","back","pinyin","audio","font","theme","newPerDay","session","speedSec","levels","cats","setAt"]) if(b[k]!==undefined) out[k]=b[k];
  out.log={...(a.log||{})}; for(const d in (b.log||{})) out.log[d]=Math.max(out.log[d]||0,b.log[d]);
  out.newLog={...(a.newLog||{})}; for(const d in (b.newLog||{})) out.newLog[d]=Math.max(out.newLog[d]||0,b.newLog[d]);
  if(b.placement&&(!a.placement||b.placement.at>a.placement.at)) out.placement=b.placement;
  return out;
}
function mergeRecs(local,remote,onLocalNewer){
  for(const id in remote){ const r=remote[id], l=local[id]; if(!l||(r[7]||0)>(l[7]||0)) local[id]=r; }
  if(onLocalNewer) for(const id in local){ const r=remote[id]; if(!r||(local[id][7]||0)>(r[7]||0)) onLocalNewer(id); }
}

/* ================= embedded Kaiti (LXGW WenKai GB, OFL), used where no system Kaiti exists, e.g. iOS/Android ================= */
async function loadKai(){
  try{
    if(!("FontFace" in window)||!document.fonts) return;
    const res=await fetch("kai.woff2"); if(!res.ok) return;
    const ff=new FontFace("HSK Kai",await res.arrayBuffer(),{display:"swap"});
    await ff.load(); document.fonts.add(ff);
  }catch(e){}
}

/* ================= data ================= */
async function loadData(){
  const res=await fetch("hsk-data.json"); if(!res.ok) throw new Error(res.status);
  const d=await res.json();
  S.cats=d.cats; S.rads=d.rads||{}; S.conf=d.conf||[];
  S.W=d.words.map((x,i)=>({i,h:x[0],lv:x[1],s:x[2].map(s=>({py:s[0],de:s[1],deSrc:s[2],en:s[3],enSrc:s[4]})),pos:x[3]?x[3].split(","):[],cat:x[4],rad:x[5],fq:x[6],ex:x[7]?{zh:x[7][0],py:x[7][1],de:x[7][2],en:x[7][3],src:x[7][4]}:null,alt:x[8]?x[8].split("|"):[]}));
  for(const c in d.chars){const v=d.chars[c];S.C[c]={c,py:v[0],en:v[1],de:v[2],deSrc:v[3],rad:v[4],cmp:[...v[5]],st:v[6],lv:v[7],sim:[...v[8]]}}
  for(const w of S.W) for(const ch of new Set(w.h)){ if(!S.charIdx.has(ch)) S.charIdx.set(ch,[]); S.charIdx.get(ch).push(w.i); }
  S.meta=d.meta;
}

/* ================= SRS (SM-2, Anki-style buttons) ================= */
// record: [interval(days), ease, due(ms), reps, lapses, correct, seen, lastSeen(ms)]
function schedule(rec,g,now){
  const r=rec?rec.slice():[0,2.5,0,0,0,0,0,0];
  let [ivl,ease,due,reps,lapses,cor,seen]=r;
  if(reps===0){
    if(g===0){ivl=0;due=now+MIN}
    else if(g===1){ivl=0;due=now+6*MIN}
    else if(g===2){ivl=1;reps=1;due=now+DAY}
    else {ivl=4;reps=1;ease+=0.15;due=now+4*DAY}
  }else{
    if(g===0){lapses++;ease=Math.max(1.3,ease-0.2);ivl=0;reps=0;due=now+10*MIN}
    else{
      const hardI=Math.max(1,ivl*1.2), goodI=Math.max(hardI+1,ivl*ease);
      if(g===1){ease=Math.max(1.3,ease-0.15);ivl=hardI}
      else if(g===2){ivl=goodI}
      else {ivl=Math.max(goodI+1,ivl*(ease+0.15)*1.3);ease+=0.15}
      ivl=Math.round(ivl*10)/10; reps++; due=now+ivl*DAY;
    }
  }
  return [ivl,Math.round(ease*100)/100,due,reps,lapses,cor+(g>0?1:0),seen+1,now];
}
function fmtSpan(ms){
  const m=ms/MIN; if(m<60) return t("unitMin",{n:Math.max(1,Math.round(m))});
  const h=m/60; if(h<20) return t("unitH",{n:Math.round(h)});
  const d=h/24; if(d<30) return t("unitD",{n:Math.round(d)});
  if(d<365) return t("unitMo",{n:Math.round(d/30)});
  return t("unitY",{n:(d/365).toFixed(1).replace(/\.0$/,"")});
}
function stat(id){const r=S.prog.p[id];if(!r)return"new";if(r[2]<=Date.now())return"due";return r[3]>0?"known":"learning"}
function logActivity(isNew){const d=today();const m=S.prog.meta;m.log[d]=(m.log[d]||0)+1;if(isNew)m.newLog[d]=(m.newLog[d]||0)+1;}
function recordAnswer(id,ok){ // non-flashcard modes: accuracy, and wrong answers come back soon
  const now=Date.now(); let r=S.prog.p[id];
  if(!r){ if(!ok){ r=[0,2.5,now,0,0,0,1,now]; } else { r=[0,2.5,now+DAY*3650,0,0,1,1,now]; r.unseen=1; } }
  else { r=r.slice(); r[6]++; if(ok) r[5]++; else { r[2]=Math.min(r[2],now); if(r[3]>0){r[4]++;r[1]=Math.max(1.3,r[1]-0.1)} } r[7]=now; }
  if(r.unseen){ // correct on a never-scheduled word: keep stats without scheduling a card
    S.prog.c["w"+id]=[(S.prog.c["w"+id]?.[0]||0)+1,(S.prog.c["w"+id]?.[1]||0)+1,now];logActivity(false);save();return;
  }
  S.prog.p[id]=r;  logActivity(false); save();
}

/* ================= selection ================= */
function pool(scope){
  const m=S.prog.meta, lv=new Set(m.levels), cats=new Set(m.cats);
  if(scope==="all") return S.W;
  return S.W.filter(w=>lv.has(w.lv)&&(!cats.size||cats.has(w.cat)));
}
function queueInfo(P){
  const now=Date.now(); let due=0,news=0,learned=0;
  for(const w of P){const r=S.prog.p[w.i]; if(!r)news++; else { if(r[2]<=now)due++; if(r[3]>0)learned++; }}
  const introduced=S.prog.meta.newLog[today()]||0;
  return {due,newAvail:Math.min(news,Math.max(0,S.prog.meta.newPerDay-introduced)),newTotal:news,learned};
}
function meaning(w,lang,short){
  const L=lang||S.prog.meta.lang;
  let s=w.s.map(x=>L==="de"?(x.de||x.en):x.en).filter(Boolean).join("; ");
  if(short){ const parts=s.split(/;\s*/); s=parts.slice(0,2).join("; "); if(s.length>48) s=parts[0]; if(s.length>60) s=s.slice(0,58)+"…"; }
  return s;
}
const pyOf=w=>w.s.map(x=>x.py).join(" / ");

/* ---------- Stats tab ---------- */
function viewStats(){
  const m=S.prog.meta, now=Date.now();
  let due=0,learned=0,cor=0,seen=0;
  const lvT={},lvL={},lvM={},catT={},catL={};
  for(const w of S.W){ lvT[w.lv]=(lvT[w.lv]||0)+1; catT[w.cat]=(catT[w.cat]||0)+1;
    const r=S.prog.p[w.i]; if(!r) continue; cor+=r[5]; seen+=r[6];
    if(r[2]<=now) due++; if(r[3]>0){learned++;lvL[w.lv]=(lvL[w.lv]||0)+1;catL[w.cat]=(catL[w.cat]||0)+1; if(r[0]>=21) lvM[w.lv]=(lvM[w.lv]||0)+1;} }
  for(const k in S.prog.c){cor+=S.prog.c[k][0];seen+=S.prog.c[k][1]}
  const acc=seen?Math.round(cor/seen*100)+" %":"–";
  // streak
  let streak=0; const d=new Date(); if(!(m.log[today(d)]>0)) d.setDate(d.getDate()-1);
  while(m.log[today(d)]>0){streak++;d.setDate(d.getDate()-1)}
  // activity
  const days=[];const dd=new Date();dd.setDate(dd.getDate()-13);for(let i=0;i<14;i++){days.push(today(dd));dd.setDate(dd.getDate()+1)}
  const mx=Math.max(1,...days.map(x=>m.log[x]||0));
  const lvBars=[1,2,3,4,5,6,7].map(l=>{const T=lvT[l]||1,L=lvL[l]||0,M=lvM[l]||0;return `<div class="bar"><span class="lab"><span class="badge">HSK ${lvName(l)}</span></span><div class="track" role="img" aria-label="${L} / ${T}"><i class="m" style="width:${M/T*100}%"></i><i class="l" style="width:${(L-M)/T*100}%"></i></div><span class="num">${L} / ${T}</span></div>`}).join("");
  const catBars=S.cats.map((c,i)=>({i,T:catT[i]||0,L:catL[i]||0})).filter(x=>x.T).sort((a,b)=>b.L/b.T-a.L/a.T||b.T-a.T).map(x=>`<div class="bar" style="grid-template-columns:minmax(0,9.5em) 1fr auto"><span class="lab">${esc(catName(x.i))}</span><div class="track"><i class="l" style="width:${x.L/x.T*100}%;background:var(--jade)"></i></div><span class="num">${x.L} / ${x.T}</span></div>`).join("");
  // weakest characters: aggregate errors over words + char drills
  const agg=new Map();
  for(const id in S.prog.p){const r=S.prog.p[id];const wr=r[6]-r[5];if(r[6]<1)continue;for(const ch of new Set(S.W[id].h)){if(!S.C[ch])continue;const a=agg.get(ch)||[0,0];a[0]+=wr;a[1]+=r[6];agg.set(ch,a)}}
  for(const k in S.prog.c){if(k[0]==="w")continue;const r=S.prog.c[k];const a=agg.get(k)||[0,0];a[0]+=r[1]-r[0];a[1]+=r[1];agg.set(k,a)}
  const weak=[...agg].filter(([c,a])=>a[0]>0&&a[1]>=2).sort((x,y)=>(y[1][0]/y[1][1])-(x[1][0]/x[1][1])||y[1][0]-x[1][0]).slice(0,16);
  return `
  <div class="kpis">
    <div class="kpi"><b>${due}</b><span>${t("kDue")}</span></div>
    <div class="kpi"><b>${streak}</b><span>${t("kStreak")}</span></div>
    <div class="kpi"><b>${acc}</b><span>${t("kAcc")}</span></div>
    <div class="kpi"><b>${learned.toLocaleString()}</b><span>${t("kLearned")}</span></div>
  </div>
  <section class="panel"><h3>${t("activity")}</h3>
    <div class="spark">${days.map((x,i)=>`<div class="${i===13?"today":""}" style="height:${(m.log[x]||0)/mx*100}%" title="${x}: ${m.log[x]||0}"></div>`).join("")}</div>
    <div class="sparkx">${days.map(x=>`<span>${+x.slice(8)}</span>`).join("")}</div>
  </section>
  <section class="panel"><div class="row between"><h3>${t("perLevel")}</h3></div>
    <div class="bars">${lvBars}</div>
    <div class="legend"><span><i style="background:var(--jade)"></i>${t("legMastered")}</span><span><i style="background:color-mix(in srgb,var(--jade) 45%,var(--sunk))"></i>${t("legLearned")}</span></div>
  </section>
  <section class="panel"><h3>${t("weakest")}</h3>
    ${weak.length?`<div class="weak">${weak.map(([c,a])=>`<button data-act="charInfo" data-ch="${esc(c)}"><span class="hz copy">${esc(c)}</span><small>${Math.round(a[0]/a[1]*100)} %</small></button>`).join("")}</div>`:`<p class="small muted" style="margin:0">${t("weakNone")}</p>`}
  </section>
  <section class="panel"><h3>${t("perCat")}</h3><div class="bars">${catBars}</div><p class="small muted" style="margin:0">${t("catAuto")}</p></section>`;
}

    <div class="list">${ws.map(w=>`<button class="li" data-act="word" data-id="${w.i}" style="text-align:left"><span class="hz copy">${esc(w.h)}</span><span><b class="small copy">${esc(pyOf(w))}</b><br><span class="small copy">${esc(meaning(w,null,true))}</span></span></button>`).join("")}</div>`);
}
function radInfo(r){const x=S.rads[r];if(!x)return "";return (S.prog.meta.lang==="en"?x.en:x.de)+(x.zh?` · ${x.zh}`:"")}
function charParts(ch){
  const c=S.C[ch]; if(!c) return "";
  const parts=c.cmp.length?c.cmp:[];
  return `<div class="feedback" style="width:100%;box-sizing:border-box"><div class="small muted">${t("parts")}</div>
   <div class="cmp"><span class="hz copy" style="font-size:34px">${esc(ch)}</span><span class="op">=</span>${parts.map(p=>`<span class="cbox"><span class="hz copy">${esc(p)}</span><span><span class="copy">${esc(compMeaning(p))}</span>${p===c.rad?` <span class="tag info">${t("radical")}</span>`:""}</span></span>`).join('<span class="op">+</span>')||'<span class="small muted">–</span>'}</div>
   <div class="small">${t("radical")}: <span class="hz copy" style="font-size:18px">${esc(c.rad)}</span> <span class="copy">${esc(radInfo(c.rad))}</span> · ${t("strokes",{n:c.st})}</div></div>`;
}
function compMeaning(p){
  const r=S.rads[p]; if(r) return S.prog.meta.lang==="en"?r.en:r.de;
  const c=S.C[p]; if(c){ const s=(S.prog.meta.lang==="de"&&c.de?c.de:c.en)||""; return s.split(/[;,]/)[0].slice(0,24); }
  return "";
}

function backHtml(w,o={}){

let SES={};
function openSession(title){const el=$("#session");el.hidden=false;document.body.style.overflow="hidden";SES={title};return el}
function closeSession(){document.body.style.overflow="";try{speechSynthesis.cancel()}catch(e){}$("#session").hidden=true;$("#session").innerHTML="";SES={};save();render()}
function frame(progress,label,body,foot){

  <div class="sbody"><div class="sinner">${body}</div></div>${foot?`<div class="sfoot">${foot}</div>`:""}`;

/* ---------- flashcards ---------- */
// New words are drawn evenly from every selected level (most frequent first within a level), shuffled across levels.
function mixedFresh(P){
  const by=new Map();
  for(const w of P){ if(S.prog.p[w.i]) continue; if(!by.has(w.lv)) by.set(w.lv,[]); by.get(w.lv).push(w); }
  for(const a of by.values()) a.sort((x,y)=>x.fq-y.fq);
  const lists=[...by.values()], out=[];
  while(lists.some(a=>a.length)){
    const order=shuffle(lists.filter(a=>a.length));
    for(const a of order) out.push(a.shift());
  }
  return out;
}
// mode: "normal" (due + today's new quota), "new" (fresh batch, ignores daily quota), "review" (practice learned cards ahead)
function startFlashcards(mode){
  const P=pool(), now=Date.now(), m=S.prog.meta;
  const fresh=mixedFresh(P);
  let q=[];
  if(mode==="new"){
    q=fresh.slice(0,m.newPerDay).map(w=>w.i);
    if(!q.length){toast(t("noMoreNew"));return}
  }else if(mode==="review"){
    q=P.filter(w=>S.prog.p[w.i]).sort((a,b)=>S.prog.p[a.i][2]-S.prog.p[b.i][2]).slice(0,m.session).map(w=>w.i);
    if(!q.length){toast(t("noReview"));return}
  }else{
    const due=P.filter(w=>{const r=S.prog.p[w.i];return r&&r[2]<=now}).sort((a,b)=>S.prog.p[a.i][2]-S.prog.p[b.i][2]);
    const introduced=m.newLog[today()]||0;
    q=due.slice(0,m.session).map(w=>w.i);
    const nNew=Math.max(0,Math.min(m.session-q.length,m.newPerDay-introduced));
    q=q.concat(fresh.slice(0,nNew).map(w=>w.i));
    if(!q.length) return startFlashcards(fresh.length?"new":"review");
  }
  shuffleSoft(q);
  openSession(t("flashcards"));
  SES={kind:"fc",q,total:q.length,done:0,cor:0,flipped:false,rerender:renderFC};
  renderFC();
}
function shuffleSoft(q){ // light shuffle keeps due cards near the front
  for(let i=0;i<q.length;i++){const j=Math.min(q.length-1,i+(Math.random()*4|0));[q[i],q[j]]=[q[j],q[i]]}
}
function renderFC(){
  if(!SES.q.length) return endFC();
  const w=S.W[SES.q[0]], r=S.prog.p[w.i], now=Date.now();
  const body=`<div class="card" data-act="flip" style="cursor:${SES.flipped?"default":"pointer"}">${bigHz(w.h,SES.flipped)}
    ${SES.flipped?`<div class="row" style="justify-content:center"><span class="badge">HSK ${lvName(w.lv)}</span>${!r?`<span class="tag info">${t("stNew")}</span>`:""}${audioBtn(w.h)}</div>${backHtml(w)}`:`<div class="tapnote">${t("tapToFlip")}</div>`}</div>
    <div class="small muted kbd" style="text-align:center">${t("keyHint")}</div>`;
  const labels=["again","hard","good","easy"];
  const foot=SES.flipped?`<div class="grades">${labels.map((l,g)=>`<button class="grade g${g}" data-act="grade" data-g="${g}">${t(l)}<small>${fmtSpan(schedule(r,g,now)[2]-now)}</small></button>`).join("")}</div>`
    :`<button class="btn primary block" data-act="flip" style="min-height:56px">${t("show")}</button>`;
  frame(SES.done/(SES.done+SES.q.length),`${SES.done} / ${SES.done+SES.q.length}`,body,foot);
}
function gradeFC(g){
  const id=SES.q.shift(), now=Date.now(), was=S.prog.p[id];
  const nr=schedule(was,g,now); S.prog.p[id]=nr;  logActivity(!was); save();
  if(g>0) SES.cor++;
  SES.done++;
  if(nr[2]-now<20*MIN){ const pos=Math.min(SES.q.length,g===0?3:6); SES.q.splice(pos,0,id); SES.done--; SES.relearn=(SES.relearn||0)+1; }
  SES.flipped=false; renderFC();
}
function endFC(){
  const P=pool(), now=Date.now(); let next=Infinity; for(const w of P){const r=S.prog.p[w.i];if(r&&r[2]>now&&r[2]<next)next=r[2]}
  const n=SES.done, pct=n?Math.round(SES.cor/Math.max(1,SES.cor+(SES.relearn||0))*100):0;
  frame(1,"",`<div class="result"><div class="hz" style="font-size:72px;color:var(--seal)">好</div><h2>${t("sessionDone")}</h2><div class="score">${n}</div><div class="muted">${t("reviewed",{n})} · ${t("correctPct",{n:pct})}</div>${next<Infinity?`<div class="small">${t("nextDue",{t:fmtSpan(next-now)})}</div>`:""}</div>`,
   `<div style="display:flex;flex-direction:column;gap:8px">${extraBtns(queueInfo(P),true)}<button class="btn block" data-act="endSession">${t("done")}</button></div>`);
}
function extraBtns(q,strong){
  const n=S.prog.meta.newPerDay;
  return `<div class="xbtns"><button class="btn ${strong?"seal":""}" data-act="startFCnew" ${q.newTotal?"":"disabled"}>${t("moreNew",{n})}</button><button class="btn" data-act="startFCreview" title="${esc(t("reviewRound"))}" aria-label="${esc(t("reviewRound"))}" ${q.learned||Object.keys(S.prog.p).length?"":"disabled"}>${ICON.repeat}</button></div>`;
}

/* ---------- multiple choice ---------- */
function pickWordsForQuiz(P,n){
  const now=Date.now();
  const seen=P.filter(w=>S.prog.p[w.i]).sort((a,b)=>{const ra=S.prog.p[a.i],rb=S.prog.p[b.i];const ea=(ra[6]-ra[5])/(ra[6]||1),eb=(rb[6]-rb[5])/(rb[6]||1);return (rb[2]<=now)-(ra[2]<=now)||eb-ea});
  const fresh=mixedFresh(P);
  const out=shuffle(seen.slice(0,Math.ceil(n*0.7)));
  for(const w of fresh){if(out.length>=n)break;out.push(w)}
  for(const w of seen.slice(Math.ceil(n*0.7))){if(out.length>=n)break;out.push(w)}
  return shuffle(out.slice(0,n));
}
function distractors(w,n,mode){
  const len=[...w.h].length, scores=new Map();
  const add=(id,s)=>{if(id===w.i)return;const x=S.W[id];if(!x)return;scores.set(id,(scores.get(id)||0)+s+([...x.h].length===len?2:0)+(Math.abs(x.lv-w.lv)<=1?1:0))};
  for(const ch of new Set(w.h)){ const c=S.C[ch]; if(!c) continue;
    for(const s of c.sim.slice(0,4)) for(const id of (S.charIdx.get(s)||[]).slice(0,40)) add(id,3);
    for(const id of (S.charIdx.get(ch)||[]).slice(0,40)) add(id,2);
  }
  const ranked=shuffle([...scores]).sort((a,b)=>b[1]-a[1]).map(x=>S.W[x[0]]);
  const out=[], seenKey=new Set([mode==="py"?normPy(pyOf(w)):meaning(w,null,true)]);
  const take=x=>{const k=mode==="py"?normPy(pyOf(x)):meaning(x,null,true);if(!k||seenKey.has(k))return;seenKey.add(k);out.push(x)};
  for(const x of ranked){if(out.length>=n)break;take(x)}
  let guard=0; while(out.length<n&&guard++<400){const x=S.W[Math.random()*S.W.length|0];if(Math.abs(x.lv-w.lv)<=1&&[...x.h].length===len)take(x)}
  return out;
}
function startMC(type){
  const P=pool(); if(P.length<4){toast(t("needSeen"));return}
  openSession(t("mMC"));
  SES={kind:"mc",type:type||"mixed",items:pickWordsForQuiz(P,12),idx:0,cor:0,answered:null,rerender:renderMC};
  renderMCStart();
}
function renderMCStart(){
  frame(0,"",`<div class="result"><div class="hz" style="font-size:64px;color:var(--seal)">认</div><h2>${t("mMC")}</h2><p class="muted">${t("mMCd")}</p>
    <div class="seg" role="group">${[["meaning",t("mcMeaning")],["py",t("mcPinyin")],["mixed",t("mcMixed")]].map(([v,l])=>`<button data-act="mcType" data-v="${v}" aria-pressed="${SES.type===v}">${esc(l)}</button>`).join("")}</div></div>`,
   `<button class="btn seal block" data-act="mcGo" style="min-height:52px">${t("go")}</button>`);
  SES.rerender=renderMCStart;
}
function buildMCQ(){
  const w=SES.items[SES.idx]; const mode=SES.type==="mixed"?(SES.idx%2?"py":"meaning"):SES.type;
  const opts=shuffle([w,...distractors(w,3,mode)]);
  SES.cur={w,mode,opts};
}
function renderMC(){
  if(SES.idx>=SES.items.length) return endQuiz(SES.cor,SES.items.length,"mc");
  if(!SES.cur) buildMCQ();
  const {w,mode,opts}=SES.cur, a=SES.answered;
  const label=x=>mode==="py"?pyOf(x):meaning(x,null,true);
  const body=`<div class="card">${bigHz(w.h,a!=null)}<div class="prompt"><div class="q">${mode==="py"?t("mcAskP"):t("mcAskM")}</div></div></div>
   <div class="opts">${opts.map((x,i)=>`<button class="opt ${a!=null?(x===w?"ok":(i===a?"bad":"")):""}" data-act="mcPick" data-i="${i}" ${a!=null?"disabled":""}><span class="k">${i+1}</span><span class="copy">${esc(label(x))}</span></button>`).join("")}</div>
   ${a!=null?`<div class="card" style="align-items:stretch"><div class="row" style="justify-content:space-between"><b style="color:${opts[a]===w?"var(--jade)":"var(--seal)"}">${opts[a]===w?t("correct"):t("wrong")}</b>${audioBtn(w.h)}</div>${backHtml(w,{forcePinyin:true})}</div>`:""}`;
  frame(SES.idx/SES.items.length,`${SES.idx+1} / ${SES.items.length}`,body,a!=null?`<button class="btn primary block" data-act="mcNext" style="min-height:52px">${t("next")}</button>`:"");
}
function pickMC(i){
  if(SES.answered!=null) return; SES.answered=i; const ok=SES.cur.opts[i]===SES.cur.w; if(ok)SES.cor++;
  recordAnswer(SES.cur.w.i,ok); renderMC();
}

/* ---------- look-alike characters ---------- */
function startSim(){
  const P=pool(); const inPool=new Set(); P.forEach(w=>{for(const c of w.h)inPool.add(c)});
  const maxLv=Math.max(...S.prog.meta.levels);
  let groups=S.conf.filter(g=>[...g].some(c=>inPool.has(c))&&[...g].every(c=>S.C[c]));
  // computed look-alikes for characters of the selection
  const extra=[]; for(const c of shuffle([...inPool]).slice(0,60)){const x=S.C[c];if(!x)continue;const sim=x.sim.filter(s=>S.C[s]&&S.C[s].lv&&S.C[s].lv<=maxLv).slice(0,2);if(sim.length>=1)extra.push(c+sim.join(""))}
  groups=shuffle(groups).slice(0,7).concat(shuffle(extra)).slice(0,12);
  if(groups.length<3){toast(t("emptyPool"));return}
  const items=groups.map(g=>{const cs=[...g];const target=cs.find(c=>inPool.has(c))||cs[0];return {target,opts:shuffle(cs.slice(0,4))}});
  openSession(t("mSim"));
  SES={kind:"sim",items:shuffle(items),idx:0,cor:0,answered:null,rerender:renderSim};
  renderSim();
}
function charMean(c){const x=S.C[c];if(!x)return"";const s=S.prog.meta.lang==="de"&&x.de?x.de:x.en;return s.split(/;/).slice(0,2).join(";").slice(0,60)}
function renderSim(){
  if(SES.idx>=SES.items.length) return endQuiz(SES.cor,SES.items.length,"sim");
  const it=SES.items[SES.idx], c=S.C[it.target], a=SES.answered;
  const body=`<div class="card"><div class="prompt"><div class="q">${t("simAsk")}</div><div class="big copy">${esc(c.py)}</div><div class="copy">${esc(charMean(it.target))}</div></div></div>
   <div class="opts hzopts">${it.opts.map((x,i)=>`<button class="opt hzo ${a!=null?(x===it.target?"ok":(i===a?"bad":"")):""}" data-act="simPick" data-i="${i}" ${a!=null?"disabled":""} aria-label="${esc(x)}"><span class="copy">${esc(x)}</span></button>`).join("")}</div>
   ${a!=null?`<div class="feedback"><b style="color:${it.opts[a]===it.target?"var(--jade)":"var(--seal)"}">${it.opts[a]===it.target?t("correct"):t("wrong")}</b><div class="small muted">${t("simWhy")}</div>
   <div class="list">${it.opts.map(x=>{const y=S.C[x];return `<div class="li"><span class="hz copy">${esc(x)}</span><span class="small"><b class="copy">${esc(y.py)}</b> · <span class="copy">${esc(charMean(x))}</span><br><span class="muted">${t("radical")} <span class="copy">${esc(y.rad)}</span> · ${t("strokes",{n:y.st})}${y.cmp.length?` · <span class="copy">${esc(y.cmp.join(" + "))}</span>`:""}</span></span></div>`}).join("")}</div></div>`:""}`;
  frame(SES.idx/SES.items.length,`${SES.idx+1} / ${SES.items.length}`,body,a!=null?`<button class="btn primary block" data-act="simNext" style="min-height:52px">${t("next")}</button>`:"");
}

/* ---------- radical trainer ---------- */
function startRad(){
  const P=pool(); const set=new Set(); P.forEach(w=>{for(const c of w.h){const x=S.C[c];if(x&&x.rad&&x.rad!==c&&x.cmp.length>=2)set.add(c)}});
  const chars=shuffle([...set]); if(chars.length<4){toast(t("emptyPool"));return}
  const freq=new Map(); Object.values(S.C).forEach(x=>{if(x.rad)freq.set(x.rad,(freq.get(x.rad)||0)+1)});
  const common=[...freq].sort((a,b)=>b[1]-a[1]).slice(0,60).map(x=>x[0]).filter(r=>S.rads[r]);
  const items=chars.slice(0,12).map((c,k)=>{
    const rad=S.C[c].rad;
    if(k%3!==2){ const opts=shuffle([rad,...shuffle(common.filter(r=>r!==rad&&!S.C[c].cmp.includes(r))).slice(0,3)]); return {type:"A",c,rad,opts}; }
    const others=shuffle(chars.filter(o=>S.C[o].rad!==rad&&!S.C[o].cmp.includes(rad)&&!o.includes(rad))).slice(0,3);
    return {type:"B",c,rad,opts:shuffle([c,...others])};
  });
  openSession(t("mRad"));
  SES={kind:"rad",items,idx:0,cor:0,answered:null,rerender:renderRad};
  renderRad();
}
function renderRad(){
  if(SES.idx>=SES.items.length) return endQuiz(SES.cor,SES.items.length,"rad");
  const it=SES.items[SES.idx], a=SES.answered;
  let body;
  const correctIdx=it.type==="A"?it.opts.indexOf(it.rad):it.opts.indexOf(it.c);
  if(it.type==="A"){
    body=`<div class="card">${bigHz(it.c,a!=null)}<div class="prompt"><div class="q">${t("radAskA")}</div></div></div>
     <div class="opts">${it.opts.map((r,i)=>`<button class="opt ${a!=null?(i===correctIdx?"ok":(i===a?"bad":"")):""}" data-act="radPick" data-i="${i}" ${a!=null?"disabled":""}><span class="hz copy" style="font-size:30px;line-height:1">${esc(r)}</span><span class="copy">${esc(radInfo(r))}</span></button>`).join("")}</div>`;
  }else{
    body=`<div class="card"><div class="bigz">${GRID}<span class="hz copy">${esc(it.rad)}</span></div><div class="prompt"><div class="q">${t("radAskB")}</div><div class="copy">${esc(radInfo(it.rad))}</div></div></div>
     <div class="opts hzopts">${it.opts.map((c,i)=>`<button class="opt hzo ${a!=null?(i===correctIdx?"ok":(i===a?"bad":"")):""}" data-act="radPick" data-i="${i}" ${a!=null?"disabled":""}><span class="copy">${esc(c)}</span></button>`).join("")}</div>`;
  }
  if(a!=null) body+=`<b style="color:${a===correctIdx?"var(--jade)":"var(--seal)"}">${a===correctIdx?t("correct"):t("wrong")}</b>${charParts(it.c)}<div class="small"><b class="copy">${esc(S.C[it.c].py)}</b> · <span class="copy">${esc(charMean(it.c))}</span></div>`;
  frame(SES.idx/SES.items.length,`${SES.idx+1} / ${SES.items.length}`,body,a!=null?`<button class="btn primary block" data-act="radNext" style="min-height:52px">${t("next")}</button>`:"");
}

/* ---------- speed round ---------- */
function startSpeed(){
  const P=pool(); if(P.length<4){toast(t("needSeen"));return}
  const items=pickWordsForQuiz(P,Math.min(P.length,200));
  openSession(t("mSpeed"));
  SES={kind:"speed",items,idx:0,known:[],unknown:[],running:false,rerender:renderSpeed};
  renderSpeed();
}
function renderSpeed(){
  const sec=S.prog.meta.speedSec;
  if(!SES.running&&SES.end==null){
    frame(0,"",`<div class="result"><div class="hz" style="font-size:64px;color:var(--seal)">快</div><h2>${t("mSpeed")}</h2><p class="muted">${t("speedReady",{n:sec})}</p></div>`,`<button class="btn seal block" data-act="speedGo" style="min-height:56px">${t("go")}</button>`);return;
  }
  if(!SES.running) return endSpeed();
  const w=SES.items[SES.idx]; if(!w) return finishSpeed();
  const left=Math.max(0,Math.ceil((SES.end-Date.now())/1000));
  frame(1-left/sec,`${SES.known.length+SES.unknown.length}`,`<div class="timer" id="spTimer">${left}</div><div class="card">${bigHz(w.h)}</div>`,
   `<div class="speedbtns"><button class="btn" data-act="speedAns" data-v="0" style="color:var(--seal)">${t("dontKnow")}</button><button class="btn primary" data-act="speedAns" data-v="1">${t("know")}</button></div>`);

/* ================= cloud backup (recovery code + encrypted blob) ================= */
const CROCKFORD="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function cloudLoad(){
  try{const s=localStorage.getItem(LS_CLOUD);S.cloud=s?JSON.parse(s):null}catch(e){S.cloud=null}
  if(S.cloud&&typeof S.cloud==="object"){ S.cloud={code:"",etag:"",lastSyncAt:0,pending:false,enabled:false,expiresAt:"",...S.cloud}; }
}
function cloudSave(){
  try{
    if(!S.cloud||!S.cloud.enabled||!S.cloud.code){ localStorage.removeItem(LS_CLOUD); return; }
    localStorage.setItem(LS_CLOUD,JSON.stringify({
      code:S.cloud.code, etag:S.cloud.etag||"", lastSyncAt:S.cloud.lastSyncAt||0,
      pending:!!S.cloud.pending, enabled:true, expiresAt:S.cloud.expiresAt||""
    }));
  }catch(e){}
}
function progressWeight(p=S.prog){ return Object.keys(p&&p.p||{}).length; }
function cloudNormCode(raw){
  let s=String(raw||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  s=s.replace(/[ILOU]/g,c=>({I:"1",L:"1",O:"0",U:"V"}[c]));
  return s;
}
function cloudFormatCode(norm){
  const g=[]; for(let i=0;i<norm.length;i+=5) g.push(norm.slice(i,i+5));
  return g.join("-");
}
function cloudRandomCode(){
  const bytes=new Uint8Array(16); crypto.getRandomValues(bytes);
  let bits=0n; for(const b of bytes) bits=(bits<<8n)|BigInt(b);
  let out=""; for(let i=0;i<26;i++){ out=CROCKFORD[Number(bits&31n)]+out; bits>>=5n; }
  return cloudFormatCode(out);
}
function b64(buf){ const u=buf instanceof ArrayBuffer?new Uint8Array(buf):buf; let s=""; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
function unb64(str){ const bin=atob(str); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function cloudShaHex(text){
  const dig=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(dig)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function cloudBackupId(norm){ return cloudShaHex("hsk-bk-id-v1|"+norm); }
async function cloudEncKey(norm, saltBytes){
  const ikm=await crypto.subtle.importKey("raw", new TextEncoder().encode(norm), "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"HKDF", hash:"SHA-256", salt:saltBytes, info:new TextEncoder().encode("hsk-bk-enc-v1")},
    ikm, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]
  );
}
function cloudExportPayload(){
  return JSON.stringify({app:"hsk3-zeichentrainer",v:1,exportedAt:new Date().toISOString(),words:S.W.length,progress:S.prog});
}
async function cloudEncrypt(norm, plaintext){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await cloudEncKey(norm, salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(plaintext));
  return { v:CLOUD_CRYPTO_V, salt:b64(salt), iv:b64(iv), ct:b64(ct) };
}
async function cloudDecrypt(norm, envelope){
  if(!envelope||envelope.v!==CLOUD_CRYPTO_V) throw new Error("cryptoV");
  const key=await cloudEncKey(norm, unb64(envelope.salt));
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(envelope.iv)}, key, unb64(envelope.ct));
  return new TextDecoder().decode(pt);
}
async function cloudApi(path, opts={}){
  const res=await fetch(path, {
    ...opts,
    headers:{ "content-type":"application/json", ...(opts.headers||{}) },
    keepalive: !!opts.keepalive
  });
  let data=null; try{ data=await res.json(); }catch(e){}
  return { res, data };
}
async function cloudFetchHealth(){
  try{
    let {res,data}=await cloudApi("/api/health");
    if(!(res.ok&&data&&data.ok)) ({res,data}=await cloudApi("/api/backup/health"));
    if(res.ok&&data&&data.ok){ S.cloudHealth=data; return data; }
  }catch(e){}
  S.cloudHealth=null; return null;
}
function cloudStatusLine(){
  if(!S.cloud||!S.cloud.enabled) return `<span class="muted">${t("cloudOff")}</span>`;
  if(S.cloud.pending) return `<span class="warn">${t("cloudPending")}</span>`;
  if(S.cloud.lastSyncAt) return `<span class="ok">${t("cloudSynced",{t:new Date(S.cloud.lastSyncAt).toLocaleString()})}</span>`;
  return `<span class="warn">${t("cloudNever")}</span>`;
}
function cloudPrefsHtml(){

  return `<div class="cloudstat" style="margin-top:8px">

    ${linked
      ? `<div class="xbtns">
           <button class="btn jade" data-act="cloudSyncNow">${t("cloudSyncNow")}</button>
           <button class="btn sky" data-act="cloudShowCode">${t("cloudShowCode")}</button>
         </div>
         <button class="btn block ghost" data-act="cloudUnlink">${t("cloudUnlink")}</button>
         <button class="btn block ghost" data-act="cloudDelete" style="color:var(--seal)">${t("cloudDelete")}</button>`
      : `<div class="xbtns">
           <button class="btn jade" data-act="cloudCreate">${t("cloudCreate")}</button>
           <button class="btn sky" data-act="cloudRestore">${t("cloudRestore")}</button>

let _cloudTimer=null, _cloudUploading=false, _cloudErrShown=false;
function cloudToastErr(opts={}){
  if(opts.silent) return;
  if(opts.autosave && _cloudErrShown) return;
  toast(t("cloudErr"));
  if(opts.autosave) _cloudErrShown=true;
}
function cloudScheduleUpload(){
  if(!S.cloud||!S.cloud.enabled||!S.cloud.code) return;
  S.cloud.pending=true; cloudSave();
  clearTimeout(_cloudTimer);
  _cloudTimer=setTimeout(()=>{ cloudFlushUpload({autosave:true}); }, 8000);
}
async function cloudFlushUpload(opts={}){
  if(!S.cloud||!S.cloud.enabled||!S.cloud.code) return {ok:false};
  if(_cloudUploading) return {ok:false,busy:true};
  const weight=progressWeight();
  if(weight===0 && !opts.allowEmpty){
    S.cloud.pending=false; cloudSave();
    if(opts.toastEmpty) toast(t("cloudEmptyBlock"));
    return {ok:false, empty:true};
  }
  _cloudUploading=true;
  try{
    const norm=cloudNormCode(S.cloud.code);
    const id=await cloudBackupId(norm);
    const envelope=await cloudEncrypt(norm, cloudExportPayload());
    const headers={};
    if(S.cloud.etag) headers["if-match"]=S.cloud.etag;
    const {res,data}=await cloudApi(`/api/backup/${id}`, {
      method:"PUT",
      headers,
      body: JSON.stringify({ ...envelope, etag:S.cloud.etag||undefined }),
      keepalive: !!opts.keepalive
    });
    if(res.status===404){
      // First upload after link without create, or expired — try create path only if we own mint.
      S.cloud.pending=true; cloudSave();
      return {ok:false, gone:true};
    }
    if(res.status===412){
      S.cloud.pending=true; cloudSave();
      if(!opts.silent) toast(t("cloudConflict"));
      await cloudResolveConflict(norm, id);
      return {ok:false, conflict:true};
    }
    if(!res.ok){ cloudToastErr(opts); return {ok:false}; }
    S.cloud.etag=data.etag||S.cloud.etag;
    S.cloud.expiresAt=data.expiresAt||S.cloud.expiresAt;
    S.cloud.lastSyncAt=Date.now();
    S.cloud.pending=false;
    _cloudErrShown=false;
    cloudSave();
    return {ok:true};
  }catch(e){
    cloudToastErr(opts);
    return {ok:false};
  }finally{ _cloudUploading=false; }
}
async function cloudResolveConflict(norm, id){
  try{
    const {res,data}=await cloudApi(`/api/backup/${id}`);
    if(!res.ok||!data) return;
    if(data.cryptoV>CLOUD_CRYPTO_V){ toast(t("cloudUnsupported")); return; }
    const txt=await cloudDecrypt(norm, data);
    // Merge remote into local, then retry put once.
    importData(txt, true, {silent:true, keepSheet:true});
    S.cloud.etag=data.etag||"";
    cloudSave();
    await cloudFlushUpload({silent:true});
  }catch(e){}
}

async function cloudConfirmCreate(){
  const expected=cloudNormCode(S._mintCode||"");
  const typed=cloudNormCode($("#cloudConfirmIn")&&$("#cloudConfirmIn").value);
  if(!expected||typed!==expected){ toast(t("cloudConfirmBad")); return; }
  toast(t("cloudBusy"));
  try{
    const id=await cloudBackupId(expected);
    const envelope=await cloudEncrypt(expected, cloudExportPayload());
    let turnstileToken="";
    if(S.cloudHealth&&S.cloudHealth.siteKey&&window.turnstile){
      // best-effort: invisible widget not mounted in sheet; skip if no widget token
      turnstileToken=S._turnstileToken||"";
    }
    const {res,data}=await cloudApi("/api/backup", {
      method:"POST",
      body: JSON.stringify({ id, turnstileToken, ...envelope })
    });
    if(res.status===409){
      // Retry/idempotent: blob already there (e.g. flaky response). Claim if decrypt works.
      const got=await cloudApi(`/api/backup/${id}`);
      if(got.res.ok&&got.data){
        try{
          await cloudDecrypt(expected, got.data);
          S.cloud={ code:cloudFormatCode(expected), etag:got.data.etag||"", lastSyncAt:Date.now(), pending:false, enabled:true, expiresAt:got.data.expiresAt||"" };
          cloudSave(); S._mintCode=null;
          closeSheet(); render(); toast(t("cloudCreated"));
          return;
        }catch(e){}
      }
      toast(t("cloudErr")); return;
    }
    if(!res.ok){ toast(t("cloudErr")); return; }
    S.cloud={ code:cloudFormatCode(expected), etag:data.etag||"", lastSyncAt:Date.now(), pending:false, enabled:true, expiresAt:data.expiresAt||"" };
    cloudSave(); S._mintCode=null;
    closeSheet(); render(); toast(t("cloudCreated"));
  }catch(e){ toast(t("cloudErr")); }
}

async function doExport(){
  const payload=JSON.stringify({app:"hsk3-zeichentrainer",v:1,exportedAt:new Date().toISOString(),words:S.W.length,progress:S.prog},null,1);
  const name="hsk-fortschritt-"+today()+".json";
  const blob=new Blob([payload],{type:"application/json"});
  const file=new File([blob],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      toast(t("saved"));
      return;
    }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast(t("saved"));
    return;
  }catch(e){}
  openSheet(t("export"),`<p class="small" style="margin:0">${t("exportFallback")}</p><textarea id="exportTxt" readonly>${esc(payload)}</textarea><button class="btn primary" data-act="copyExport">${t("copy")}</button>`);
}
function importData(txt,merge,opts={}){
  let d; try{d=JSON.parse(txt)}catch(e){ if(!opts.silent) toast(t("importBad")); return false; }
  const p=d&&d.progress; if(!p||typeof p!=="object"||!p.p||!p.meta){ if(!opts.silent) toast(t("importBad")); return false; }
  // Empty/fresh installs must not poison cloud merge with young timestamps.
  if(merge && progressWeight()===0) merge=false;
  if(merge){ mergeRecs(S.prog.p,p.p); for(const c in (p.c||{})){const l=S.prog.c[c],r=p.c[c];if(!l||(r[2]||0)>(l[2]||0))S.prog.c[c]=r} S.prog.meta=mergeMeta(S.prog.meta,p.meta); }
  else { S.prog={v:1,p:p.p,c:p.c||{},meta:{...DEF_META,...p.meta}}; }
  lsSet(); applyPrefs();
  if(!opts.keepSheet) closeSheet();
  render();
  if(!opts.silent) toast(t("importOk",{n:Object.keys(p.p).length}));
  cloudScheduleUpload();
  return true;
}

  blockCopyClick=!!now&&now!==selAtDown;
});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act],[data-say],[data-tab]"); if(!el) return;
  if(blockCopyClick){
    blockCopyClick=false;
    const sel=window.getSelection();
    if(sel&&!sel.isCollapsed&&sel.anchorNode&&el.contains(sel.anchorNode)) return;
  }
  if(el.dataset.say!=null){e.stopPropagation();speak(el.dataset.say);return}
  if(el.dataset.tab){go(el.dataset.tab);return}
  const a=el.dataset.act, m=S.prog.meta;
  switch(a){
    case "openSel": openSel(); break;
    case "selLv": {const v=+el.dataset.v;SEL.levels.has(v)?SEL.levels.delete(v):SEL.levels.add(v);renderSel();break}
    case "selLvAll": SEL.levels=new Set(SEL.levels.size===7?[]:[1,2,3,4,5,6,7]);renderSel();break;
    case "selCat": {const v=+el.dataset.v;SEL.cats.has(v)?SEL.cats.delete(v):SEL.cats.add(v);renderSel();break}
    case "selCatAll": SEL.cats=new Set();renderSel();break;
    case "selApply": if(!SEL.levels.size){toast(t("needLevel"));break} m.levels=[...SEL.levels].sort();m.cats=[...SEL.cats].sort((a,b)=>a-b);m.setAt=Date.now();save();closeSheet();render();break;
    case "closeSheet": closeSheet(); break;
    case "startFC": closeSheet(); startFlashcards("normal"); break;
    case "startFCextra": case "startFCreview": closeSheet(); startFlashcards("review"); break;
    case "startFCnew": closeSheet(); startFlashcards("new"); break;
    case "mode": startMode(el.dataset.mode); break;
    case "endSession": clearTimeout(SES.tm); closeSession(); break;
    case "flip": if(SES.kind==="fc"&&!SES.flipped){SES.flipped=true;renderFC()} break;
    case "grade": gradeFC(+el.dataset.g); break;
    case "mcType": SES.type=el.dataset.v; renderMCStart(); break;
    case "mcGo": SES.rerender=renderMC; renderMC(); break;
    case "mcPick": pickMC(+el.dataset.i); break;
    case "mcNext": SES.idx++; SES.cur=null; SES.answered=null; renderMC(); break;
    case "simPick": { if(SES.answered!=null)break; const i=+el.dataset.i, it=SES.items[SES.idx]; SES.answered=i; const ok=it.opts[i]===it.target; if(ok)SES.cor++; recordChar(it.target,ok); renderSim(); break; }
    case "simNext": SES.idx++; SES.answered=null; renderSim(); break;
    case "radPick": { if(SES.answered!=null)break; const i=+el.dataset.i, it=SES.items[SES.idx]; SES.answered=i; const ci=it.type==="A"?it.opts.indexOf(it.rad):it.opts.indexOf(it.c); const ok=i===ci; if(ok)SES.cor++; recordChar(it.c,ok); renderRad(); break; }
    case "radNext": SES.idx++; SES.answered=null; renderRad(); break;
    case "speedGo": SES.running=true; SES.end=Date.now()+S.prog.meta.speedSec*1000; renderSpeed(); speedTick(); break;
    case "speedAns": speedAns(+el.dataset.v); break;
    case "placeGo": SES.started=true; renderPlace(); break;
    case "placePick": placePick(+el.dataset.i); break;
    case "placeNext": placeNext(); break;
    case "placeSet": m.levels=[+el.dataset.l]; m.setAt=Date.now();  save(); closeSession(); break;
    case "word": wordSheet(+el.dataset.id); break;
    case "charInfo": e.stopPropagation(); charSheet(el.dataset.ch); break;
    case "dueNow": { const id=+el.dataset.id; const r=S.prog.p[id]; S.prog.p[id]=r?[...r.slice(0,2),Date.now(),...r.slice(3,7),r[7]||Date.now()]:[0,2.5,Date.now(),0,0,0,0,Date.now()];  save(); toast(t("markedDue")); closeSheet(); render(); break; }
    case "wscope": S.wl.scope=el.dataset.v; S.wl.limit=80; render(); break;
    case "wclaude": S.wl.claude=!S.wl.claude; S.wl.limit=80; render(); break;
    case "wmore": S.wl.limit+=120; render(); break;
    case "reviewClaude": S.wl={q:"",scope:"all",claude:true,limit:80}; go("words"); break;
    case "pref": { const k=el.dataset.k; let v=el.dataset.v; if(v==="true")v=true; else if(v==="false")v=false; m[k]=v; m.setAt=Date.now();  save(); applyPrefs(); render(); break; }
    case "export": doExport(); break;
    case "import": $("#importFile").click(); break;
    case "importPaste": importSheet(""); break;
    case "doImport": importData($("#importTxt").value,$("#importMerge").checked); break;
    case "copyExport": { const ta=$("#exportTxt"); navigator.clipboard&&navigator.clipboard.writeText(ta.value).then(()=>toast(t("copied")),()=>{ta.select()}); if(!navigator.clipboard)ta.select(); break; }
    case "cloudCreate": cloudBeginCreate(); break;
    case "cloudConfirmCreate": cloudConfirmCreate(); break;
    case "cloudRestore": cloudRestoreSheet(); break;
    case "cloudRestoreGo": cloudDoRestore($("#cloudRestoreIn")&&$("#cloudRestoreIn").value); break;
    case "cloudBootRestore": cloudDoRestore(S.cloud&&S.cloud.code, {merge:false}); break;
    case "cloudSyncNow": cloudFlushUpload({toastEmpty:true}).then(r=>{ if(r&&r.ok){ toast(t("saved")); if(S.tab==="prefs") render(); } }); break;
    case "cloudShowCode": if(S.cloud&&S.cloud.code) cloudShowCodeSheet(S.cloud.code); break;
    case "cloudCopyCode": { const c=el.dataset.code||""; navigator.clipboard&&navigator.clipboard.writeText(c).then(()=>toast(t("copied")),()=>{}); break; }
    case "cloudShareCode": { const c=el.dataset.code||""; if(navigator.share){ navigator.share({title:"HSK backup",text:c}).catch(()=>{}); } else if(navigator.clipboard){ navigator.clipboard.writeText(c).then(()=>toast(t("copied"))); } break; }
    case "cloudUnlink": cloudUnlink(); break;
    case "cloudDelete": openSheet(t("cloudDelete"),`<p style="margin:0">${t("cloudWarnAccess")}</p><div class="row"><button class="btn" data-act="closeSheet">${t("cancel")}</button><button class="btn seal" data-act="cloudDeleteYes">${t("cloudDelete")}</button></div>`); break;
    case "cloudDeleteYes": cloudDeleteRemote(); break;
    case "reset": openSheet(t("reset"),`<p style="margin:0">${t("resetQ")}</p><div class="row"><button class="btn" data-act="closeSheet">${t("cancel")}</button><button class="btn seal" data-act="resetYes">${t("resetYes")}</button></div>`); break;
    case "resetYes": S.prog.p={}; S.prog.c={}; m.log={}; m.newLog={}; m.placement=null; save(); closeSheet(); render(); toast(t("resetDone")); break;
  }
});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")closeSheet()});
$("#langDe").onclick=()=>setLang("de"); $("#langEn").onclick=()=>setLang("en");
document.addEventListener("input",e=>{
  if(e.target.id==="wsearch"){S.wl.q=e.target.value;S.wl.limit=80;clearTimeout(S._st);S._st=setTimeout(()=>{const pos=e.target.selectionStart;render();const n=$("#wsearch");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}},180)}
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.pref; if(k){S.prog.meta[k]=+e.target.value;S.prog.meta.setAt=Date.now();save();render()}
  if(e.target.id==="importFile"){const f=e.target.files&&e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>importSheet(String(rd.result));rd.readAsText(f);e.target.value=""}
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")) return;
  if(!$("#sheet").hidden&&e.key==="Escape"){closeSheet();return}
  if($("#session").hidden) return;
  const k=e.key;
  if(k==="Escape"){clearTimeout(SES.tm);closeSession();return}
  if(SES.kind==="fc"){ if((k===" "||k==="Enter")&&!SES.flipped){e.preventDefault();SES.flipped=true;renderFC()} else if(SES.flipped&&/^[1-4]$/.test(k)) gradeFC(+k-1); }
  else if(SES.kind==="mc"&&SES.items&&SES.rerender===renderMC){ if(SES.answered==null&&/^[1-4]$/.test(k))pickMC(+k-1); else if(SES.answered!=null&&(k==="Enter"||k===" ")){e.preventDefault();SES.idx++;SES.cur=null;SES.answered=null;renderMC()} }
  else if(SES.kind==="speed"&&SES.running){ if(k==="ArrowRight"||k==="k")speedAns(1); else if(k==="ArrowLeft"||k==="j")speedAns(0); }
  else if(SES.kind==="place"&&SES.started&&!SES.finished){ if(SES.answered==null&&/^[1-4]$/.test(k))placePick(+k-1); else if(SES.answered!=null&&(k==="Enter"||k===" ")){e.preventDefault();placeNext()} }
});
window.addEventListener("pagehide",()=>{lsSet(); cloudFlushUpload({silent:true,keepalive:true});});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ lsSet(); cloudFlushUpload({silent:true,keepalive:true}); }
});

/* ================= boot ================= */
function registerSW(){
  if(!("serviceWorker" in navigator)) return;
  const ok=location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1";
  if(!ok) return;
  let refreshing=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  navigator.serviceWorker.register("./sw.js").then(reg=>{
    const ask=(worker)=>{
      if(!worker) return;
      const el=$("#toast");
      el.textContent=t("updateAvail");
      el.hidden=false;
      el.style.cursor="pointer";
      const go=()=>{
        el.removeEventListener("click",go);
        el.style.cursor="";
        el.hidden=true;
        worker.postMessage({type:"SKIP_WAITING"});
      };
      el.addEventListener("click",go);
      clearTimeout(toast._t);
    };
    if(reg.waiting) ask(reg.waiting);
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed"&&navigator.serviceWorker.controller) ask(nw);
      });
    });
  }).catch(()=>{});
}
(async function boot(){
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  const local=lsGet();
  if(local&&local.p&&local.meta){S.prog={v:1,p:local.p,c:local.c||{},meta:{...DEF_META,...local.meta}}}
  const h=(location.hash||"").slice(1); if(["learn","stats","words","prefs"].includes(h)) S.tab=h;
  applyPrefs(); $("#loadMsg").textContent=t("loading");
  try{ await loadData(); }
  catch(e){ $("#main").innerHTML=`<div class="loading"><div><div class="hz">字</div><p>${t("loadFail")}</p></div></div>`; return; }
  $("#tabs").hidden=false; render();
  loadKai();
  registerSW();
  cloudBootCheck();
})();
</script>
